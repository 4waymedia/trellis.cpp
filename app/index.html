<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trellis Studio</title>
    <!-- The vendored <model-viewer> (three.js-based) is loaded at runtime from
         public/vendor by viewer.ts, so Vite doesn't try to bundle it. -->
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◈</span> Trellis Studio
      </div>
      <div class="status">
        <span id="backend-badge" class="badge" title="active backend">—</span>
        <span id="server-dot" class="dot" title="server status"></span>
        <span id="server-label" class="server-label">connecting…</span>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      </div>
    </header>

    <div id="setup-banner" class="banner hidden">
      <span></span>
      <button id="banner-settings" class="link-btn">Open settings</button>
    </div>

    <main class="workspace">
      <section class="panel panel-left">
        <div id="dropzone" class="dropzone" tabindex="0">
          <img id="input-preview" class="input-preview hidden" alt="input" />
          <div id="dropzone-hint" class="dropzone-hint">
            <div class="dz-icon">⬆</div>
            <div>Drop an image here</div>
            <div class="muted">or click to browse</div>
          </div>
          <input id="file-input" type="file" accept="image/*" multiple hidden />
        </div>

        <div class="controls">
          <label class="ctl">
            <span>Resolution</span>
            <select id="ctl-res">
              <option value="512">512 · light</option>
              <option value="1024" selected>1024 · cascade</option>
              <option value="1536">1536 · high</option>
            </select>
          </label>
          <label class="ctl">
            <span>Background removal</span>
            <select id="ctl-bg">
              <option value="auto" selected>auto</option>
              <option value="birefnet">birefnet</option>
              <option value="threshold">threshold</option>
            </select>
          </label>
          <label class="ctl">
            <span>UV unwrap</span>
            <select id="ctl-uv">
              <option value="xatlas" selected>xatlas</option>
              <option value="box">box (faster)</option>
            </select>
          </label>
          <!-- Output budget: pick a preset; Faces/Atlas sit under "Customize" for
               fine-tuning (editing either switches the preset to Custom).
               Texture format follows the preset (presets.ts, texturesFor). -->
          <div class="output-group">
            <label class="ctl">
              <span>Output preset</span>
              <select id="ctl-preset"></select>
            </label>
            <div id="preset-hint" class="preset-hint muted"></div>
            <details class="customize">
              <summary>Customize faces &amp; atlas</summary>
              <div class="ctl-row">
                <label class="ctl" title="Mesh decimation target. Lower = lighter file; the texture keeps the surface detail. auto = 300K (150K at res 512).">
                  <span>Faces</span>
                  <select id="ctl-faces">
                    <option value="0" selected>auto</option>
                    <option value="150000">150K</option>
                    <option value="100000">100K</option>
                    <option value="50000">50K</option>
                    <option value="25000">25K</option>
                    <option value="10000">10K</option>
                  </select>
                </label>
                <label class="ctl" title="Texture size in px (square). auto = 2048 (1024 at res 512).">
                  <span>Atlas</span>
                  <select id="ctl-atlas">
                    <option value="0" selected>auto</option>
                    <option value="1024">1024</option>
                    <option value="2048">2048</option>
                    <option value="4096">4096</option>
                  </select>
                </label>
              </div>
            </details>
          </div>
          <label class="ctl">
            <span>Seed</span>
            <input id="ctl-seed" type="number" min="0" step="1" value="42" />
          </label>
        </div>

        <button id="generate-btn" class="primary" disabled>Generate 3D</button>

        <div id="progress" class="progress hidden">
          <div class="bar"><div class="bar-fill"></div></div>
          <div id="progress-stage" class="progress-stage muted">starting…</div>
          <div id="progress-elapsed" class="progress-elapsed muted">0:00</div>
          <button id="cancel-btn" class="link-btn">Cancel</button>
        </div>

        <div id="queue" class="queue hidden">
          <div class="queue-head">
            <span id="queue-label">Queued · 0</span>
            <button id="clear-queue" class="link-btn">Clear</button>
          </div>
          <div id="queue-list" class="queue-list"></div>
        </div>
      </section>

      <section class="panel viewer-panel">
        <div id="viewer-mount" class="viewer-mount"></div>
        <div class="viewer-toolbar">
          <button id="reset-view" class="tool-btn" disabled>Reset view</button>
          <button id="clay-toggle" class="tool-btn" aria-pressed="false" disabled
            title="Show the model untextured (matte grey) to judge the form without the paint">Clay</button>
          <button id="wire-toggle" class="tool-btn" aria-pressed="false" disabled
            title="Draw the mesh's triangles over the surface to see its face density">Wireframe</button>
          <button id="save-glb" class="tool-btn" disabled>Save GLB…</button>
          <button id="export-handoff" class="tool-btn" disabled
            title="Write a folder for a 3D modeler: GLB, source image, textures, turnaround sheets and notes">Export handoff…</button>
          <span id="viewer-caption" class="viewer-caption muted"></span>
        </div>
      </section>
    </main>

    <section class="gallery-wrap">
      <div class="gallery-head">
        <span>Gallery</span>
        <button id="clear-gallery" class="link-btn">Clear all</button>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <span>Settings</span>
          <button id="settings-close" class="icon-btn">✕</button>
        </div>
        <div id="settings-body" class="modal-body"></div>
      </div>
    </div>

    <div id="toasts" class="toasts"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
